version: "3.9"

services:
  api:
    build: .
    container_name: empireof8-api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongo
    env_file:
      - .env.docker

  postgres:
    image: postgres:16
    container_name: empireof8-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "empire8_db"
      POSTGRES_USER: "empire8_user"
      POSTGRES_PASSWORD: "empire8_pass"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: empireof8-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:

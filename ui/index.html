<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Empire of 8 — Chairman Console</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #050816;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
    }
    .shell {
      width: 100%;
      max-width: 900px;
      margin: 24px;
      border-radius: 12px;
      background: radial-gradient(circle at top left, #111827 0, #020617 55%, #000 100%);
      box-shadow: 0 24px 80px rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(148,163,184,0.3);
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(148,163,184,0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to right, #020617, #111827);
    }
    .agent-select {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-size: 12px;
      color: #9ca3af;
    }
    .agent-select label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
    }
    .agent-select select {
      background: rgba(15,23,42,0.95);
      color: #e5e7eb;
      border-radius: 6px;
      border: 1px solid rgba(148,163,184,0.7);
      padding: 4px 8px;
      font-size: 12px;
    }
    header h1 {
      font-size: 18px;
      margin: 0;
    }
    header span {
      font-size: 12px;
      color: #9ca3af;
    }
    #chat {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      font-size: 14px;
      background: radial-gradient(circle at top, rgba(15,23,42,0.9), #020617 55%, #000 100%);
    }
    .message-row {
      margin-bottom: 12px;
      display: flex;
    }
    .message-row.user {
      justify-content: flex-end;
    }
    .message-row.agent {
      justify-content: flex-start;
    }
    .bubble {
      max-width: 70%;
      padding: 10px 12px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .user .bubble {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #e5e7eb;
      border-bottom-right-radius: 2px;
    }
    .agent .bubble {
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.5);
      color: #e5e7eb;
      border-bottom-left-radius: 2px;
    }
    .meta {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 3px;
    }
    footer {
      padding: 12px 16px 14px;
      border-top: 1px solid rgba(148,163,184,0.3);
      background: #020617;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #input {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(55,65,81,0.9);
      background: rgba(15,23,42,0.9);
      color: #e5e7eb;
      font-size: 14px;
      outline: none;
    }
    #input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 1px rgba(99,102,241,0.7);
    }
    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #022c22;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button[disabled] {
      opacity: 0.5;
      cursor: default;
    }
    .status {
      font-size: 12px;
      color: #9ca3af;
      margin-left: 4px;
    }
    code.inline {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: rgba(15,23,42,0.8);
      padding: 1px 4px;
      border-radius: 4px;
      border: 1px solid rgba(55,65,81,0.9);
      font-size: 11px;
    }
  </style>
  <!-- Markdown + sanitization libraries for rendering agent replies -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.3/dist/purify.min.js"></script>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>Empire of 8 — Chairman Console</h1>
        <span>Talk to your AI / automation brain via <code class="inline">POST /route</code></span>
      </div>
      <div class="agent-select">
        <label for="agent">Active agent</label>
        <select id="agent">
          <option value="coa">COA (solo)</option>
          <option value="team">COA + Team (orchestrated)</option>
          <option value="agriculture">Agriculture Agent</option>
          <option value="finance">Finance &amp; Capital Agent</option>
          <option value="real_estate">Real Estate &amp; Infrastructure Agent</option>
          <option value="people">People &amp; Organization Agent</option>
          <option value="technology">Technology &amp; Automation Agent</option>
          <option value="growth">Sales &amp; Growth Agent</option>
          <option value="governance">Regulation &amp; Governance Agent</option>
          <option value="health">Health &amp; Education Agent</option>
        </select>
        <span id="status" class="status">Idle</span>
      </div>
    </header>
    <div id="chat"></div>
    <footer>
      <textarea id="input" placeholder="Ask a question or issue a command..." rows="2"></textarea>
      <button id="sendBtn">Send</button>
    </footer>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('status');
    const agentSelectEl = document.getElementById('agent');

    function appendMessage(role, text, meta) {
      const row = document.createElement('div');
      row.className = `message-row ${role}`;

      const col = document.createElement('div');
      const metaEl = document.createElement('div');
      metaEl.className = 'meta';
      metaEl.textContent = meta || (role === 'user' ? 'You' : 'Agent');

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      // For agent messages, render Markdown to HTML and sanitize it.
      if (role === 'agent' && window.marked && window.DOMPurify) {
        const html = DOMPurify.sanitize(marked.parse(text));
        bubble.innerHTML = html;
      } else {
        bubble.textContent = text;
      }

      col.appendChild(metaEl);
      col.appendChild(bubble);
      row.appendChild(col);
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage('user', text, 'You');
      inputEl.value = '';
      inputEl.focus();

      const agent = agentSelectEl.value;

      let path = '/route';
      switch (agent) {
        case 'team':
          path = '/route/team';
          break;
        case 'agriculture':
          path = '/route/agriculture';
          break;
        case 'finance':
          path = '/route/finance';
          break;
        case 'real_estate':
          path = '/route/real_estate';
          break;
        case 'people':
          path = '/route/people';
          break;
        case 'technology':
          path = '/route/technology';
          break;
        case 'growth':
          path = '/route/growth';
          break;
        case 'governance':
          path = '/route/governance';
          break;
        case 'health':
          path = '/route/health';
          break;
        default:
          path = '/route';
      }

      sendBtn.disabled = true;
      statusEl.textContent = `Calling ${path}...`;

      try {
        const res = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task: text })
        });

        const data = await res.json();
        const meta = data.agent ? `Agent: ${data.agent}` : 'Agent';

        // Prefer showing the natural-language reply when available.
        // Fall back to pretty-printed JSON (useful for errors/debugging).
        const isOk = data.status === 'ok';
        const textToShow = isOk && data.reply
          ? data.reply
          : JSON.stringify(data, null, 2);

        appendMessage('agent', textToShow, meta);
        statusEl.textContent = 'Idle';
      } catch (err) {
        appendMessage('agent', 'Error talking to backend: ' + err, 'Error');
        statusEl.textContent = 'Error';
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // Initial system hint
    appendMessage('agent', 'Welcome to the Empire of 8 Chairman Console. Select an agent in the top-right. "COA (solo)" answers directly; "COA + Team" has the chairman consult relevant domain agents and then synthesize a board-level answer. The UI will call the corresponding /route/* endpoint and show the JSON response from the backend.', 'System');
  </script>
</body>
</html>
